[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabotyping-agentic-workbench"
version = "0.2.0"
description = "Offline MVP for agentic metabolomics dataset discovery, harmonization review, and MoTrPAC-style metadata-readiness evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Samuel Montalvo", email = "smontal@stanford.edu" },
  { name = "Eric Leslie" },
  { name = "Laurens van de Wiel" },
  { name = "Matthew T. Wheeler" },
]
keywords = ["metabolomics", "harmonization", "exercise", "research software"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
plotting = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.scripts]
metabo-agent = "metabotyping_agentic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metabotyping_agentic = ["plotting/*.R", "review/schemas/*.json"]

[tool.setuptools.data-files]
"share/metabotyping-agentic-workbench/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
